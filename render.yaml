services:
  - type: web
    name: pms-api
    env: dotnet
    plan: free
    buildCommand: "cd PMS.API && dotnet publish -c Release -o ./publish"
    startCommand: "cd PMS.API/publish && dotnet PMS.API.dll"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: pms-db
          property: connectionString

databases:
  - name: pms-db
    plan: free
    databaseName: pms
    user: pms_user
